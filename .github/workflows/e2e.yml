name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecom_test
      NODE_ENV: development
      # Optional staging override; when set the Playwright config skips the
      # built-in webServer and points at the external URL.
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push DB schema
        if: ${{ env.E2E_BASE_URL == '' }}
        run: pnpm --filter @workspace/db run push
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  sentry-sourcemaps:
    needs: playwright
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_API: ${{ secrets.SENTRY_PROJECT_API }}
      SENTRY_PROJECT_WEB: ${{ secrets.SENTRY_PROJECT_WEB }}
      SENTRY_RELEASE: ${{ github.sha }}
      VITE_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build storefront with sourcemaps
        run: pnpm --filter @workspace/storefront run build
      - name: Build api-server with sourcemaps
        run: pnpm --filter @workspace/api-server run build
      - name: Upload storefront sourcemaps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_PROJECT_WEB != '' }}
        uses: getsentry/action-release@v1
        with:
          environment: production
          version: ${{ github.sha }}
          projects: ${{ secrets.SENTRY_PROJECT_WEB }}
          sourcemaps: ./artifacts/storefront/dist
          url_prefix: "~/"
      - name: Upload api-server sourcemaps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_PROJECT_API != '' }}
        uses: getsentry/action-release@v1
        with:
          environment: production
          version: ${{ github.sha }}
          projects: ${{ secrets.SENTRY_PROJECT_API }}
          sourcemaps: ./artifacts/api-server/dist
          url_prefix: "~/"
