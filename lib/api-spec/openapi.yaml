openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: E-commerce storefront API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: products
  - name: cart
  - name: orders
  - name: shipping
  - name: blog
  - name: admin
  - name: webhooks
  - name: discounts
  - name: reviews
  - name: newsletter
  - name: Storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List published products
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [products]
      summary: Featured products for homepage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/{slug}:
    get:
      operationId: getProductBySlug
      tags: [products]
      summary: Get product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current cart
      parameters:
        - name: cartId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                cartId: { type: string }
                productId: { type: integer }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, quantity]
              properties:
                cartId: { type: string }
                quantity: { type: integer, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      operationId: removeCartItem
      tags: [cart]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
        - name: cartId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /cart/discount:
    post:
      operationId: applyCartDiscount
      tags: [cart]
      summary: Apply a discount code to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, code]
              properties:
                cartId: { type: string }
                code: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: removeCartDiscount
      tags: [cart]
      summary: Remove the discount code from the cart
      parameters:
        - name: cartId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/resume:
    get:
      operationId: resumeCart
      tags: [cart]
      summary: Resume a cart from a signed abandoned-cart link
      parameters:
        - name: cartId
          in: query
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /shipping/rates:
    post:
      operationId: getShippingRates
      tags: [shipping]
      summary: Get live shipping rates from EasyPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, address]
              properties:
                cartId: { type: string }
                address: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShippingRate" }

  /checkout:
    post:
      operationId: createCheckout
      tags: [orders]
      summary: Create Stripe checkout session for cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId]
              properties:
                cartId: { type: string }
                email: { type: string, format: email }
                address: { $ref: "#/components/schemas/AddressInput" }
                shippingRateId: { type: string }
                discountCode: { type: string }
                analyticsEventId: { type: ["string", "null"] }
                analyticsClientId: { type: ["string", "null"] }
                analyticsFbp: { type: ["string", "null"] }
                analyticsFbc: { type: ["string", "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url, orderId]
                properties:
                  url: { type: string }
                  orderId: { type: integer }

  /orders/me:
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: List signed-in user's orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: cartId
          in: query
          required: false
          description: Guest receipt token. Authorizes a non-signed-in shopper to view the order if it matches the order's originating cartId.
          schema: { type: string }
        - name: sessionId
          in: query
          required: false
          description: Stripe Checkout Session id. Authorizes a non-signed-in shopper to view the order if it matches the order's stripeSessionId.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/lookup:
    post:
      operationId: lookupOrder
      tags: [orders]
      summary: Look up an order by ID and email or magic-link token (guest checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: integer }
                email: { type: string, format: email }
                token: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/by-token:
    post:
      operationId: lookupOrderByToken
      tags: [orders]
      summary: Look up an order using only the signed magic-link token from the order confirmation email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{id}/reorder:
    post:
      operationId: reorder
      tags: [orders, cart]
      summary: Add every still-available item from a past order to the current cart
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cartId: { type: ["string", "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderResponse" }
        "401": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /blog/posts:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List published blog posts
      parameters:
        - name: tag
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlogPost" }
  /blog/posts/{slug}:
    get:
      operationId: getBlogPostBySlug
      tags: [blog]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard summary
      parameters:
        - name: marketingRange
          in: query
          description: Time window in days for the Marketing panel sparklines and totals.
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 7
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStats" }
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /admin/products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /admin/orders/by-email/{email}:
    get:
      operationId: listAdminOrdersByEmail
      tags: [admin]
      summary: List every order placed under a given email (case-insensitive equality)
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [email, orders]
                properties:
                  email: { type: string }
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
  /admin/products/inventory/bulk:
    post:
      operationId: bulkUpdateInventory
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkInventoryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /admin/products/export.csv:
    get:
      operationId: exportProductsCsv
      tags: [admin]
      summary: CSV export of all products
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
  /admin/orders/{id}/shipping-rates:
    post:
      operationId: getAdminOrderShippingRates
      tags: [admin]
      summary: Get live EasyPost rates for an existing order's shipping address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rates]
                properties:
                  shipmentId: { type: ["string", "null"] }
                  rates:
                    type: array
                    items: { $ref: "#/components/schemas/ShippingRate" }
  /admin/orders/labels/merge-pdf:
    post:
      operationId: mergeOrderLabelsPdf
      tags: [admin]
      summary: Merge shipping labels for the given orders into a single 4x6 PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderIds]
              properties:
                orderIds:
                  type: array
                  items: { type: integer }
                  minItems: 1
      responses:
        "200":
          description: A merged PDF with one label per page
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /admin/orders/{id}/fulfill:
    post:
      operationId: fulfillOrder
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingRateId]
              properties:
                shippingRateId: { type: string }
                shipmentId: { type: ["string", "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /admin/blog/posts:
    get:
      operationId: listAdminBlogPosts
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BlogPost" }
    post:
      operationId: createBlogPost
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogPostInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
  /admin/blog/posts/{id}:
    patch:
      operationId: updateBlogPost
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlogPostInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
    delete:
      operationId: deleteBlogPost
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/blog/posts/by-slug/{slug}:
    get:
      operationId: getAdminBlogPostBySlug
      tags: [admin]
      summary: Fetch any blog post by slug (including unpublished drafts) for admin preview
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlogPost" }
        "404": { $ref: "#/components/responses/NotFound" }

  /discounts/validate:
    post:
      operationId: validateDiscount
      tags: [discounts]
      summary: Validate a discount code against a cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, cartId]
              properties:
                code: { type: string }
                cartId: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountValidation" }

  /newsletter/subscribe:
    post:
      tags: [newsletter]
      operationId: subscribeNewsletter
      summary: Subscribe an email to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsletterSubscribeBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsletterSubscribeResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /newsletter/unsubscribe:
    post:
      tags: [newsletter]
      operationId: unsubscribeNewsletter
      summary: Public, token-based unsubscribe (used by email links)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsletterUnsubscribeBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewsletterUnsubscribeResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/newsletter/subscribers:
    get:
      tags: [admin, newsletter]
      operationId: listAdminNewsletterSubscribers
      summary: List newsletter subscribers (paginated, searchable)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, unsubscribed, all] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNewsletterSubscriberList" }

  /admin/newsletter/subscribers/export.csv:
    get:
      tags: [admin, newsletter]
      operationId: exportAdminNewsletterSubscribers
      summary: Download all subscribers as CSV
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, unsubscribed, all] }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /admin/newsletter/subscribers/{id}/unsubscribe:
    post:
      tags: [admin, newsletter]
      operationId: adminUnsubscribeNewsletterSubscriber
      summary: Unsubscribe a subscriber and remove them from the Resend audience
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNewsletterSubscriber" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /products/{slug}/reviews:
    get:
      operationId: listProductReviews
      tags: [reviews]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewList" }
    post:
      operationId: submitProductReview
      tags: [reviews]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, title, body]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 120 }
                body: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }

  /admin/discount-codes:
    get:
      operationId: listAdminDiscountCodes
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscountCode" }
    post:
      operationId: createDiscountCode
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountCodeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCode" }
  /admin/discount-codes/{id}:
    patch:
      operationId: updateDiscountCode
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountCodeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCode" }
    delete:
      operationId: deleteDiscountCode
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [admin]
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Review" }
  /admin/reviews/{id}:
    patch:
      operationId: moderateReview
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, approved, rejected] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
    delete:
      operationId: deleteReview
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/abandoned-carts:
    get:
      operationId: listAdminAbandonedCarts
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AbandonedCart" }

  /admin/contact-quarantine:
    get:
      operationId: listAdminContactQuarantine
      tags: [admin]
      summary: List recently quarantined (shadow-accepted) contact submissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContactQuarantineList" }

  /admin/contact-quarantine/{id}/forward:
    post:
      operationId: forwardAdminContactQuarantine
      tags: [admin]
      summary: Forward a quarantined message to the owner inbox
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContactQuarantineForwardResult" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/contact-quarantine/{id}:
    delete:
      operationId: deleteAdminContactQuarantine
      tags: [admin]
      summary: Permanently delete a quarantined message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }

  /admin/tax-summary:
    get:
      operationId: getAdminTaxSummary
      tags: [admin]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxSummary" }

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    HealthStatus:
      type: object
      required: [status, checks]
      properties:
        status: { type: string }
        requestId: { type: ["string", "null"] }
        checks:
          type: object
          required: [db, stripe, resend]
          properties:
            db: { $ref: "#/components/schemas/DependencyCheck" }
            stripe: { $ref: "#/components/schemas/DependencyCheck" }
            resend: { $ref: "#/components/schemas/DependencyCheck" }
            webhook: { $ref: "#/components/schemas/DependencyCheck" }
    DependencyCheck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        detail: { type: ["string", "null"] }
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    Product:
      type: object
      required: [id, slug, name, description, priceCents, currency, images, inventory, lowStockThreshold, featured, published, createdAt]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        shortDescription: { type: ["string", "null"] }
        priceCents: { type: integer }
        compareAtCents: { type: ["integer", "null"] }
        currency: { type: string }
        images:
          type: array
          items: { type: string }
        inventory: { type: integer }
        lowStockThreshold: { type: integer }
        weightOz: { type: ["number", "null"] }
        tags:
          type: array
          items: { type: string }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        featured: { type: boolean }
        published: { type: boolean }
        averageRating: { type: ["number", "null"] }
        reviewCount: { type: integer }
        createdAt: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [slug, name, description, priceCents, inventory]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        shortDescription: { type: ["string", "null"] }
        priceCents: { type: integer }
        compareAtCents: { type: ["integer", "null"] }
        currency: { type: string, default: usd }
        images:
          type: array
          items: { type: string }
        inventory: { type: integer }
        lowStockThreshold: { type: integer, default: 5 }
        weightOz: { type: ["number", "null"] }
        tags:
          type: array
          items: { type: string }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        featured: { type: boolean }
        published: { type: boolean }

    Cart:
      type: object
      required: [id, items, subtotalCents, currency]
      properties:
        id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        subtotalCents: { type: integer }
        currency: { type: string }
        discountCode: { type: ["string", "null"] }
        discountCents: { type: integer }
        totalCents: { type: integer }
    CartItem:
      type: object
      required: [id, productId, quantity, product, lineTotalCents]
      properties:
        id: { type: integer }
        productId: { type: integer }
        quantity: { type: integer }
        product: { $ref: "#/components/schemas/Product" }
        lineTotalCents: { type: integer }

    AddressInput:
      type: object
      required: [name, street1, city, state, zip, country]
      properties:
        name: { type: string }
        street1: { type: string }
        street2: { type: ["string", "null"] }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        country: { type: string }
        phone: { type: ["string", "null"] }

    ShippingRate:
      type: object
      required: [id, carrier, service, amountCents, currency, deliveryDays]
      properties:
        id: { type: string }
        carrier: { type: string }
        service: { type: string }
        amountCents: { type: integer }
        currency: { type: string }
        deliveryDays: { type: ["integer", "null"] }

    Order:
      type: object
      required: [id, status, items, subtotalCents, shippingCents, taxCents, totalCents, currency, createdAt]
      properties:
        id: { type: integer }
        status: { type: string }
        email: { type: ["string", "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotalCents: { type: integer }
        shippingCents: { type: integer }
        taxCents: { type: integer }
        discountCents: { type: integer }
        discountCode: { type: ["string", "null"] }
        totalCents: { type: integer }
        currency: { type: string }
        shippingAddress: { $ref: "#/components/schemas/AddressInput" }
        trackingCode: { type: ["string", "null"] }
        carrier: { type: ["string", "null"] }
        trackingUrl: { type: ["string", "null"] }
        labelUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    OrderItem:
      type: object
      required: [id, productId, productName, quantity, priceCents]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        productImage: { type: ["string", "null"] }
        quantity: { type: integer }
        priceCents: { type: integer }

    ReorderResponse:
      type: object
      required: [cart, skipped]
      properties:
        cart: { $ref: "#/components/schemas/Cart" }
        skipped:
          type: array
          items:
            type: object
            required: [productName, reason]
            properties:
              productId: { type: ["integer", "null"] }
              productName: { type: string }
              quantity: { type: integer }
              reason:
                type: string
                enum: [unavailable, out_of_stock]

    BlogPost:
      type: object
      required: [id, slug, title, excerpt, content, published, createdAt]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        content: { type: string }
        coverImage: { type: ["string", "null"] }
        author: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        published: { type: boolean }
        publishedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    BlogPostInput:
      type: object
      required: [slug, title, excerpt, content]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        content: { type: string }
        coverImage: { type: ["string", "null"] }
        author: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        published: { type: boolean }

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }

    DiscountCode:
      type: object
      required: [id, code, type, value, redemptionsCount, active, createdAt]
      properties:
        id: { type: integer }
        code: { type: string }
        type: { type: string, enum: [percent, fixed] }
        value: { type: integer }
        minSubtotalCents: { type: ["integer", "null"] }
        maxRedemptions: { type: ["integer", "null"] }
        redemptionsCount: { type: integer }
        expiresAt: { type: ["string", "null"], format: date-time }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    DiscountCodeInput:
      type: object
      required: [code, type, value]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [percent, fixed] }
        value: { type: integer, minimum: 1 }
        minSubtotalCents: { type: ["integer", "null"] }
        maxRedemptions: { type: ["integer", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }
        active: { type: boolean }
    DiscountValidation:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        reason: { type: ["string", "null"] }
        code: { type: ["string", "null"] }
        type: { type: ["string", "null"], enum: [percent, fixed, null] }
        value: { type: ["integer", "null"] }
        discountCents: { type: integer }
        subtotalCents: { type: integer }
        totalCents: { type: integer }

    Review:
      type: object
      required: [id, productId, rating, title, body, status, verifiedPurchase, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productSlug: { type: ["string", "null"] }
        productName: { type: ["string", "null"] }
        rating: { type: integer }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        verifiedPurchase: { type: boolean }
        authorName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ReviewList:
      type: object
      required: [items, averageRating, count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        averageRating: { type: ["number", "null"] }
        count: { type: integer }

    AbandonedCart:
      type: object
      required: [id, cartId, email, createdAt]
      properties:
        id: { type: integer }
        cartId: { type: string }
        email: { type: string }
        userId: { type: ["string", "null"] }
        subtotalCents: { type: integer }
        itemCount: { type: integer }
        firstReminderSentAt: { type: ["string", "null"], format: date-time }
        secondReminderSentAt: { type: ["string", "null"], format: date-time }
        recoveredAt: { type: ["string", "null"], format: date-time }
        recoveredOrderId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    TaxSummary:
      type: object
      required: [taxCollectedCents, taxableOrders, currency, stripeTaxEnabled]
      properties:
        taxCollectedCents: { type: integer }
        taxableOrders: { type: integer }
        currency: { type: string }
        stripeTaxEnabled: { type: boolean }
        warning: { type: ["string", "null"] }

    AdminStats:
      type: object
      required:
        [
          totalOrders,
          ordersToday,
          revenueCentsToday,
          ordersThisMonth,
          revenueCentsThisMonth,
          pendingFulfillment,
          lowStock,
          totalProducts,
          webhookHealthy,
          marketing,
        ]
      properties:
        totalOrders: { type: integer }
        ordersToday: { type: integer }
        revenueCentsToday: { type: integer }
        ordersThisMonth: { type: integer }
        revenueCentsThisMonth: { type: integer }
        pendingFulfillment: { type: integer }
        lowStock: { type: integer }
        totalProducts: { type: integer }
        webhookLastReceivedAt: { type: ["string", "null"], format: date-time }
        webhookHealthy: { type: boolean }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        marketing: { $ref: "#/components/schemas/MarketingStats" }

    BulkInventoryInput:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          items:
            type: object
            required: [id, inventory]
            properties:
              id: { type: integer }
              inventory: { type: integer, minimum: 0 }
              lowStockThreshold: { type: ["integer", "null"], minimum: 0 }

    MarketingStats:
      type: object
      required:
        [
          newsletterSubscribers,
          rangeDays,
          ordersInRange,
          revenueCentsInRange,
          ga4Url,
          subscribersDaily,
          ordersDaily,
          revenueCentsDaily,
        ]
      properties:
        newsletterSubscribers: { type: integer }
        rangeDays:
          type: integer
          description: The time window (in days) the totals and daily series cover.
          enum: [7, 30, 90]
        ordersInRange:
          type: integer
          description: Paid orders count within the selected time window.
        revenueCentsInRange:
          type: integer
          description: Paid revenue in cents within the selected time window.
        ga4Url: { type: ["string", "null"] }
        subscribersDaily:
          type: array
          items: { $ref: "#/components/schemas/MarketingDailyPoint" }
        ordersDaily:
          type: array
          items: { $ref: "#/components/schemas/MarketingDailyPoint" }
        revenueCentsDaily:
          type: array
          items: { $ref: "#/components/schemas/MarketingDailyPoint" }

    MarketingDailyPoint:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
          description: Day in YYYY-MM-DD format (UTC-naive calendar date).
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        value: { type: integer }

    NewsletterSubscribeBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        source: { type: ["string", "null"] }

    NewsletterSubscribeResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        alreadySubscribed: { type: boolean }

    NewsletterUnsubscribeBody:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 8 }

    NewsletterUnsubscribeResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        email: { type: ["string", "null"] }

    AdminNewsletterSubscriber:
      type: object
      required: [id, email, status, source, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        source: { type: ["string", "null"] }
        status: { type: string, enum: [active, unsubscribed] }
        createdAt: { type: string, format: date-time }
        unsubscribedAt: { type: ["string", "null"], format: date-time }
        resendContactId: { type: ["string", "null"] }

    AdminNewsletterSubscriberList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminNewsletterSubscriber" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    AdminContactQuarantineEntry:
      type: object
      required: [id, name, email, subject, message, reasons, createdAt, expiresAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        subject: { type: string }
        message: { type: string }
        reasons:
          type: array
          items: { type: string }
        ip: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        forwardedAt: { type: ["string", "null"], format: date-time }

    AdminContactQuarantineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminContactQuarantineEntry" }

    AdminContactQuarantineForwardResult:
      type: object
      required: [id, forwardedAt]
      properties:
        id: { type: integer }
        forwardedAt: { type: string, format: date-time }
